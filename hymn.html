<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2563eb">
    <link rel="manifest" href="./manifest.json">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/hymn.css">
    <title>Hymn · Hymnal</title>
</head>
<body class="reading-page">
    <header class="site-header">
        <a class="brand" href="./index.html" aria-label="Hymnal home">
            <span class="brand-mark" aria-hidden="true">✝</span>
            <span>Hymnal</span>
        </a>

        <div class="header-actions">
            <button
                class="icon-button"
                id="theme-toggle"
                type="button"
                aria-label="Toggle dark mode"
            >
                ☾
            </button>
            <button
                class="icon-button"
                id="settings-open"
                type="button"
                aria-label="Open settings"
            >
                ⚙
            </button>
        </div>
    </header>

    <main class="hymn-shell">
        <div class="hymn-topbar">
            <a class="back-link" href="./hymn-list.html">
                ← <span>All hymns</span>
            </a>

            <button
                id="favorite-toggle"
                class="favorite-button"
                type="button"
            >
                ☆ <span>Favorite</span>
            </button>
        </div>

        <article
            id="hymn-content"
            class="hymn-content"
            aria-live="polite"
        ></article>
    </main>

    <div id="settings-modal" class="modal" hidden>
        <div class="modal-backdrop" data-close-settings></div>

        <section
            class="settings-panel"
            role="dialog"
            aria-modal="true"
            aria-labelledby="settings-title"
        >
            <div class="panel-heading">
                <div>
                    <p class="eyebrow">Personalize</p>
                    <h2 id="settings-title">Settings</h2>
                </div>

                <button
                    class="icon-button"
                    type="button"
                    data-close-settings
                    aria-label="Close settings"
                >
                    ×
                </button>
            </div>

            <div class="settings-group">
                <h3>Appearance</h3>
                <div class="choice-row">
                    <button class="choice-button" data-theme-choice="light" type="button">
                        Light
                    </button>
                    <button class="choice-button" data-theme-choice="dark" type="button">
                        Dark
                    </button>
                </div>
            </div>

            <div class="settings-group">
                <h3>Text size</h3>
                <div class="choice-row">
                    <button class="choice-button" data-size-choice="small" type="button">A−</button>
                    <button class="choice-button" data-size-choice="normal" type="button">A</button>
                    <button class="choice-button" data-size-choice="large" type="button">A+</button>
                    <button class="choice-button" data-size-choice="xlarge" type="button">A++</button>
                </div>
            </div>

            <p class="settings-note">
                Your preferences and favorites stay on this device.
                The hymnal does not require an account.
            </p>
        </section>
    </div>

    <script src="./js/hymns.js"></script>
    <script src="./js/app.js"></script>
    <script src="./js/hymn.js"></script>
</body>
</html>
