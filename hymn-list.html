<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#6f3d2e"><link rel="manifest" href="./manifest.json"><link rel="stylesheet" href="./css/style.css"><title>All Hymns · Hymnal</title></head>
<body class="list-page"><header class="site-header"><a class="brand" href="./index.html" aria-label="Hymnal home"><span class="brand-mark" aria-hidden="true">✝</span><span>Hymnal</span></a><div class="header-actions"><button class="icon-button" id="theme-toggle" type="button" aria-label="Toggle dark mode">☾</button><button class="icon-button" id="settings-open" type="button" aria-label="Open settings">⚙</button></div></header>
<main class="list-shell"><div class="page-heading"><a class="back-link" href="./index.html">← <span>Home</span></a><div><p class="eyebrow">Hymnal</p><h1>All hymns</h1><p id="list-count" class="page-subtitle"></p></div></div><label class="search-box list-search" for="list-search"><span aria-hidden="true">⌕</span><input id="list-search" type="search" autocomplete="off" placeholder="Search by name, number, words, author..." aria-label="Search all hymns"><button id="list-search-clear" class="clear-button" type="button" aria-label="Clear search" hidden>×</button></label><div id="hymn-list-results" class="hymn-list-results" aria-live="polite"></div></main>
<div id="settings-modal" class="modal" hidden><div class="modal-backdrop" data-close-settings></div><section class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settings-title"><div class="panel-heading"><div><p class="eyebrow">Personalize</p><h2 id="settings-title">Settings</h2></div><button class="icon-button" type="button" data-close-settings aria-label="Close settings">×</button></div><div class="settings-group"><h3>Appearance</h3><div class="choice-row"><button class="choice-button" data-theme-choice="light" type="button">Light</button><button class="choice-button" data-theme-choice="dark" type="button">Dark</button></div></div><div class="settings-group"><h3>Text size</h3><div class="choice-row"><button class="choice-button" data-size-choice="small" type="button">A−</button><button class="choice-button" data-size-choice="normal" type="button">A</button><button class="choice-button" data-size-choice="large" type="button">A+</button><button class="choice-button" data-size-choice="xlarge" type="button">A++</button></div></div><p class="settings-note">Your preferences and favorites stay on this device. The hymnal does not require an account.</p></section></div>
<script src="./js/hymns.js"></script><script src="./js/app.js"></script></body></html>
